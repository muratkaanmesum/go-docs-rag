services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD}@db:5432/rag
      OLLAMA_URL: http://ollama:11434
      ANTHROPIC_BASE_URL: http://cli-proxy-api:8317
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS}
    depends_on: [db, ollama]
    networks: [default, dokploy-network]

  db:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5; ollama pull bge-m3; wait"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:

networks:
  dokploy-network:
    external: true
